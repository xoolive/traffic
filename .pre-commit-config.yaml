repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      #- id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: readsb
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Cache payloads are fixtures, not source JSON; preserve their writer format.
        exclude: ^(tests/(cache|cartes)/|docs/cache/)
  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        description: Type check with ty.
        entry: >-
          uv run ty check --python-version 3.12
          src/traffic/data/resolver src/traffic/data/basic
          tests/test_resolver.py tests/test_field15.py
          tests/test_airspace_migration.py
        language: system
        pass_filenames: false
        require_serial: true
